<svg fill="none" viewBox="0 0 850 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; padding: 10px 15px; box-sizing: border-box; display: flex; justify-content: center; align-items: center;">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');

        * { box-sizing: border-box; }

        .banner-card {
          width: 100%;
          height: 100%;
          border-radius: 20px;
          background: linear-gradient(135deg, rgba(8, 14, 28, 0.96) 0%, rgba(13, 22, 45, 0.98) 50%, rgba(6, 11, 22, 0.96) 100%);
          border: 1px solid rgba(0, 242, 254, 0.35);
          box-shadow: 0 20px 45px rgba(0, 0, 0, 0.75), 0 0 35px rgba(0, 242, 254, 0.15), inset 0 0 30px rgba(0, 242, 254, 0.04);
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          position: relative;
          overflow: hidden;
          padding: 18px 24px;
          text-align: center;
          font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Top decorative bar with animated cyber pulse */
        .top-bar {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 3px;
          background: linear-gradient(90deg, transparent, #00f2fe, #818cf8, #f43f5e, #00f2fe, transparent);
          background-size: 200% 100%;
          animation: barSlide 4s linear infinite;
        }

        @keyframes barSlide {
          0% { background-position: 200% 0; }
          100% { background-position: -200% 0; }
        }

        /* Ambient glowing circles in background */
        .glow-orb-1 {
          position: absolute;
          width: 250px;
          height: 250px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(0, 242, 254, 0.12) 0%, transparent 70%);
          top: -100px;
          left: -60px;
          pointer-events: none;
        }

        .glow-orb-2 {
          position: absolute;
          width: 280px;
          height: 280px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(168, 85, 247, 0.14) 0%, transparent 70%);
          bottom: -110px;
          right: -70px;
          pointer-events: none;
        }

        /* Cyber grid lines */
        .grid-bg {
          position: absolute;
          inset: 0;
          background-image: 
            linear-gradient(to right, rgba(0, 242, 254, 0.03) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
          background-size: 24px 24px;
          pointer-events: none;
        }

        .meta-pill {
          display: inline-flex;
          align-items: center;
          gap: 7px;
          padding: 3px 12px;
          border-radius: 20px;
          background: rgba(0, 242, 254, 0.06);
          border: 1px solid rgba(0, 242, 254, 0.25);
          font-size: 11px;
          font-weight: 600;
          color: #38bdf8;
          letter-spacing: 0.12em;
          margin-bottom: 8px;
          text-transform: uppercase;
        }

        .pulse-dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #00f2fe;
          box-shadow: 0 0 8px #00f2fe;
          animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
          0%, 100% { opacity: 0.4; transform: scale(0.9); }
          50% { opacity: 1; transform: scale(1.15); }
        }

        .title {
          font-family: 'Syne', sans-serif;
          font-size: 38px;
          font-weight: 800;
          margin: 0;
          line-height: 1.15;
          letter-spacing: -0.5px;
          background: linear-gradient(135deg, #00f2fe 0%, #38bdf8 25%, #818cf8 60%, #c084fc 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 0 18px rgba(0, 242, 254, 0.45));
          animation: titleGlow 4s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
          0% { filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.35)); }
          100% { filter: drop-shadow(0 0 26px rgba(129, 140, 248, 0.65)); }
        }

        .subtitle {
          color: #94a3b8;
          font-size: 13.5px;
          margin-top: 7px;
          font-weight: 600;
          letter-spacing: 0.3px;
        }

        .sparkle {
          color: #00f2fe;
          display: inline-block;
          margin: 0 4px;
        }

        .badges-wrapper {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          justify-content: center;
          margin-top: 14px;
        }

        .cyber-badge {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 4px 11px;
          border-radius: 6px;
          font-size: 11.5px;
          font-weight: 600;
          background: rgba(0, 242, 254, 0.05);
          border: 1px solid rgba(0, 242, 254, 0.28);
          color: #7dd3fc;
        }

        .cyber-badge.roblox {
          background: rgba(239, 68, 68, 0.08);
          border-color: rgba(239, 68, 68, 0.38);
          color: #fca5a5;
        }

        .cyber-badge.purple {
          background: rgba(168, 85, 247, 0.08);
          border-color: rgba(168, 85, 247, 0.38);
          color: #d8b4fe;
        }

        .cyber-badge.gold {
          background: rgba(245, 158, 11, 0.08);
          border-color: rgba(245, 158, 11, 0.38);
          color: #fde68a;
        }

        .cyber-badge.emerald {
          background: rgba(16, 185, 129, 0.08);
          border-color: rgba(16, 185, 129, 0.38);
          color: #a7f3d0;
        }
      </style>

      <div class="banner-card">
        <div class="top-bar"></div>
        <div class="glow-orb-1"></div>
        <div class="glow-orb-2"></div>
        <div class="grid-bg"></div>

        <div class="meta-pill">
          <span class="pulse-dot"></span>
          <span>ROYAL ARCHITECTURE // DEV &amp; GAMEDEV PORTAL</span>
        </div>

        <h1 class="title">Muhammad Ikhsan Fauzi</h1>
        <div class="subtitle">
          <span class="sparkle">&#10022;</span> Software Engineer &#8226; Roblox Game Dev &#8226; Full-Stack &#8226; UI/UX &amp; 2D Animator <span class="sparkle">&#10022;</span>
        </div>

        <div class="badges-wrapper">
          <div class="cyber-badge roblox">
            <span>&#9864;</span> Roblox Game Dev (Luau)
          </div>
          <div class="cyber-badge">
            <span>&#123;&#125;</span> Full-Stack Developer
          </div>
          <div class="cyber-badge gold">
            <span>&#9998;</span> UI/UX &amp; 2D Animation
          </div>
          <div class="cyber-badge purple">
            <span>&#9881;</span> MikroTik MTCNA &#8226; Linux
          </div>
          <div class="cyber-badge emerald">
            <span>&#9678;</span> Tasikmalaya / Depok, ID
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>