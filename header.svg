<svg fill="none" viewBox="0 0 850 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-family: sans-serif; position: relative;">
      
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');

        .header-container {
          position: relative;
          z-index: 2;
          width: 100%;
        }

        .name {
          font-family: 'Syne', sans-serif;
          font-size: 46px;
          font-weight: 800;
          margin: 0;
          letter-spacing: -0.5px;
          background: linear-gradient(135deg, #00f2fe 0%, #4facfe 35%, #818cf8 70%, #c084fc 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 0 16px rgba(0, 242, 254, 0.45));
          animation: royalGlow 3.5s ease-in-out infinite;
        }

        @keyframes royalGlow {
          0%, 100% { filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.35)); }
          50% { filter: drop-shadow(0 0 24px rgba(129, 140, 248, 0.6)); }
        }

        .subtitle {
          font-family: 'JetBrains Mono', monospace;
          color: #94a3b8;
          font-size: 14px;
          margin-top: 8px;
          font-weight: 600;
          letter-spacing: 0.5px;
        }

        .sparkle {
          display: inline-block;
          color: #00f2fe;
        }

        .badges-wrapper {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          justify-content: center;
          margin-top: 18px;
          font-family: 'JetBrains Mono', monospace;
        }

        .cyber-badge {
          display: inline-flex;
          align-items: center;
          gap: 7px;
          padding: 5px 12px;
          border-radius: 4px;
          font-size: 12px;
          font-weight: 500;
          background: rgba(0, 242, 254, 0.05);
          border: 1px solid rgba(0, 242, 254, 0.3);
          color: #7dd3fc;
        }

        .cyber-badge.purple {
          background: rgba(168, 85, 247, 0.05);
          border-color: rgba(168, 85, 247, 0.3);
          color: #d8b4fe;
        }

        .cyber-badge.gold {
          background: rgba(245, 158, 11, 0.05);
          border-color: rgba(245, 158, 11, 0.3);
          color: #fde68a;
        }

        .cyber-badge.emerald {
          background: rgba(16, 185, 129, 0.05);
          border-color: rgba(16, 185, 129, 0.3);
          color: #a7f3d0;
        }
      </style>

      <div class="header-container">
        <h1 class="name">Muhammad Ikhsan Fauzi</h1>
        <div class="subtitle">
          <span class="sparkle">&#10022;</span> Software Engineer &#8226; Full-Stack Developer &#8226; UI/UX &amp; 2D Animator <span class="sparkle">&#10022;</span>
        </div>

        <div class="badges-wrapper">
          <div class="cyber-badge">
            <span>&#123;&#125;</span> Full-Stack Developer
          </div>
          <div class="cyber-badge gold">
            <span>&#9998;</span> UI/UX &amp; 2D Animation
          </div>
          <div class="cyber-badge purple">
            <span>&#9881;</span> MikroTik MTCNA &#8226; Linux
          </div>
          <div class="cyber-badge emerald">
            <span>&#9678;</span> Tasikmalaya / Depok, ID
          </div>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>