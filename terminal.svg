<svg fill="none" viewBox="0 0 850 350" width="100%" height="350" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; padding: 2px 4px; box-sizing: border-box; display: flex; justify-content: center; align-items: center;">
      
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');

        .window {
          width: 100%;
          border-radius: 14px;
          background: linear-gradient(135deg, rgba(7, 13, 26, 0.98) 0%, rgba(10, 17, 36, 1) 60%, rgba(6, 11, 22, 0.98) 100%);
          border: 1px solid rgba(0, 242, 254, 0.35);
          box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(129, 140, 248, 0.15), 0 0 35px rgba(0, 242, 254, 0.18), inset 0 0 25px rgba(0, 242, 254, 0.05);
          font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
          overflow: hidden;
          position: relative;
        }

        .scanline {
          position: absolute;
          inset: 0;
          background: linear-gradient(to bottom, transparent, rgba(0, 242, 254, 0.09), transparent);
          opacity: 0;
          animation: scan 4s ease-in-out infinite;
          pointer-events: none;
          z-index: 10;
        }

        @keyframes scan {
          0% { transform: translateY(-100%); opacity: 0; }
          25% { opacity: 0.7; }
          75% { opacity: 0.3; }
          100% { transform: translateY(100%); opacity: 0; }
        }

        .header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 10px 16px;
          border-bottom: 1px solid rgba(0, 242, 254, 0.18);
          background: rgba(4, 8, 18, 0.85);
        }

        .dots { display: flex; gap: 7px; }
        .dot { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.4); }
        .dot.red { background: #ff5f57; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #28c840; }

        .title { font-size: 11px; color: rgba(125, 211, 252, 0.85); letter-spacing: 0.2em; font-weight: 600; }

        .status { display: flex; align-items: center; gap: 7px; font-size: 10px; color: #38bdf8; font-weight: 600; letter-spacing: 0.08em; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #00f2fe; box-shadow: 0 0 10px #00f2fe; animation: pulse 2s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .body { padding: 16px 20px; display: flex; font-size: 12px; line-height: 1.7; position: relative; }
        .gutter { display: flex; flex-direction: column; align-items: flex-end; padding-right: 16px; color: #334155; user-select: none; font-weight: 500; }
        .code { display: flex; flex-direction: column; width: 100%; overflow: hidden; }
        
        .line-box {
          display: inline-block;
          overflow: hidden;
          white-space: nowrap;
          vertical-align: bottom;
        }

        /* 14s TOTAL LOOP CYCLE WITH MECHANICAL TYPING EFFECT */
        .type-l1  { animation: tL1  14s infinite; }
        .type-l2  { animation: tL2  14s infinite; }
        .type-l3  { animation: tL3  14s infinite; }
        .type-l4  { animation: tL4  14s infinite; }
        .type-l5  { animation: tL5  14s infinite; }
        .type-l6  { animation: tL6  14s infinite; }
        .type-l7  { animation: tL7  14s infinite; }
        .type-l8  { animation: tL8  14s infinite; }
        .type-l9  { animation: tL9  14s infinite; }
        .type-l10 { animation: tL10 14s infinite; }
        .type-l11 { animation: tL11 14s infinite; }

        @keyframes tL1  { 0% { max-width: 0; opacity: 1; } 6%  { max-width: 100%; } 92% { max-width: 100%; opacity: 1; } 95% { opacity: 0; } 100% { max-width: 0; opacity: 0; } }
        @keyframes tL2  { 0%, 6%  { max-width: 0; opacity: 1; } 13% { max-width: 100%; } 92% { max-width: 100%; opacity: 1; } 95% { opacity: 0; } 100% { max-width: 0; opacity: 0; } }
        @keyframes tL3  { 0%, 13% { max-width: 0; opacity: 1; } 20% { max-width: 100%; } 92% { max-width: 100%; opacity: 1; } 95% { opacity: 0; } 100% { max-width: 0; opacity: 0; } }
        @keyframes tL4  { 0%, 20% { max-width: 0; opacity: 1; } 28% { max-width: 100%; } 92% { max-width: 100%; opacity: 1; } 95% { opacity: 0; } 100% { max-width: 0; opacity: 0; } }
        @keyframes tL5  { 0%, 28% { max-width: 0; opacity: 1; } 37% { max-width: 100%; } 92% { max-width: 100%; opacity: 1; } 95% { opacity: 0; } 100% { max-width: 0; opacity: 0; } }
        @keyframes tL6  { 0%, 37% { max-width: 0; opacity: 1; } 46% { max-width: 100%; } 92% { max-width: 100%; opacity: 1; } 95% { opacity: 0; } 100% { max-width: 0; opacity: 0; } }
        @keyframes tL7  { 0%, 46% { max-width: 0; opacity: 1; } 55% { max-width: 100%; } 92% { max-width: 100%; opacity: 1; } 95% { opacity: 0; } 100% { max-width: 0; opacity: 0; } }
        @keyframes tL8  { 0%, 55% { max-width: 0; opacity: 1; } 64% { max-width: 100%; } 92% { max-width: 100%; opacity: 1; } 95% { opacity: 0; } 100% { max-width: 0; opacity: 0; } }
        @keyframes tL9  { 0%, 64% { max-width: 0; opacity: 1; } 73% { max-width: 100%; } 92% { max-width: 100%; opacity: 1; } 95% { opacity: 0; } 100% { max-width: 0; opacity: 0; } }
        @keyframes tL10 { 0%, 73% { max-width: 0; opacity: 1; } 82% { max-width: 100%; } 92% { max-width: 100%; opacity: 1; } 95% { opacity: 0; } 100% { max-width: 0; opacity: 0; } }
        @keyframes tL11 { 0%, 82% { max-width: 0; opacity: 1; } 88% { max-width: 100%; } 92% { max-width: 100%; opacity: 1; } 95% { opacity: 0; } 100% { max-width: 0; opacity: 0; } }

        .cursor {
          display: inline-block;
          width: 8px;
          height: 14px;
          background-color: #00f2fe;
          vertical-align: middle;
          margin-left: 5px;
          animation: blink 0.9s step-end infinite;
          box-shadow: 0 0 8px #00f2fe;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .footer {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 7px 16px;
          border-top: 1px solid rgba(0, 242, 254, 0.15);
          background: rgba(0, 242, 254, 0.04);
          color: #64748b;
          font-size: 11px;
        }
      </style>

      <div class="window">
        <div class="scanline"></div>
        
        <div class="header">
          <div class="dots">
            <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
          </div>
          <div class="title">developer.ts</div>
          <div class="status"><div class="status-dot"></div>ONLINE</div>
        </div>

        <div class="body">
          <div class="gutter">
            <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span>
          </div>
          
          <div class="code">
            <div><span class="line-box type-l1" style="color: #c084fc;"><span style="color: #f43f5e;">import</span> { FullStack, RobloxStudio, SpatialWebAR } <span style="color: #f43f5e;">from</span> <span style="color: #38bdf8;">"@ikhsan/craft"</span>;</span></div>
            <div><span class="line-box type-l2" style="color: #e2e8f0;"><span style="color: #f43f5e;">export const</span> <span style="color: #facc15;">developer</span>: Engineer = {</span></div>
            <div><span class="line-box type-l3" style="color: #e2e8f0;">  name: <span style="color: #00f2fe;">"Muhammad Ikhsan Fauzi"</span>,</span></div>
            <div><span class="line-box type-l4" style="color: #e2e8f0;">  role: <span style="color: #a78bfa;">"Software Engineer &amp; Roblox Game Dev"</span>,</span></div>
            <div><span class="line-box type-l5" style="color: #e2e8f0;">  gamedev: [<span style="color: #fca5a5;">"Roblox Studio (Luau)"</span>, <span style="color: #fde68a;">"Unity"</span>, <span style="color: #fde68a;">"PyOpenGL 3D"</span>],</span></div>
            <div><span class="line-box type-l6" style="color: #e2e8f0;">  stack: [<span style="color: #7dd3fc;">"TypeScript"</span>, <span style="color: #7dd3fc;">"React"</span>, <span style="color: #7dd3fc;">"Next.js"</span>, <span style="color: #7dd3fc;">"Python"</span>, <span style="color: #7dd3fc;">"Laravel"</span>],</span></div>
            <div><span class="line-box type-l7" style="color: #e2e8f0;">  creative: [<span style="color: #f472b6;">"After Effects 2D Animation"</span>, <span style="color: #f472b6;">"Figma UI/UX"</span>],</span></div>
            <div><span class="line-box type-l8" style="color: #e2e8f0;">  systems: [<span style="color: #34d399;">"MikroTik MTCNA (#2505NA5241)"</span>, <span style="color: #34d399;">"Red Hat Linux"</span>],</span></div>
            <div><span class="line-box type-l9" style="color: #94a3b8;">  focus: <span style="color: #fde68a;">"Architecting immersive web apps, spatial 3D &amp; high-performance games"</span>,</span></div>
            <div><span class="line-box type-l10" style="color: #e2e8f0;">  build: <span style="color: #f43f5e;">async</span> () =&gt; <span style="color: #f43f5e;">await</span> Impact.ship({ standard: <span style="color: #00f2fe;">"Exceptional"</span> })</span></div>
            <div><span class="line-box type-l11" style="color: #e2e8f0;">};<span class="cursor"></span></span></div>
          </div>
        </div>

        <div class="footer">
          <div style="display: flex; gap: 14px;"><span style="color: #00f2fe;">&#10140; git:(main)</span><span>Ln 11, Col 2</span></div>
          <div style="display: flex; gap: 14px;"><span style="color: #00f2fe;">&#9679; Standalone Engine</span><span style="color: #38bdf8;">TypeScript</span></div>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>