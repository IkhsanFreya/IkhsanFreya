          </div>
          
          <div class="code">
            <div class="line l1" style="color: #c084fc;"><span style="color: #f43f5e;">import</span> { SystemEngine, WebAR } <span style="color: #f43f5e;">from</span> <span style="color: #38bdf8;">"@unsil/core"</span>;</div>
            <div class="line l2" style="color: #e2e8f0;"><span style="color: #f43f5e;">export const</span> <span style="color: #facc15;">architect</span>: Engineer = {</div>
            <div class="line l3" style="color: #e2e8f0;">  name: <span style="color: #00f2fe;">"Muhammad Ikhsan Fauzi"</span>,</div>
            <div class="line l4" style="color: #e2e8f0;">  alias: <span style="color: #a78bfa;">"@IkhsanFreya"</span>,</div>
            <div class="line l5" style="color: #e2e8f0;">  education: <span style="color: #34d399;">"Informatics Engineering @ Universitas Siliwangi [GPA 3.65]"</span>,</div>
            <div class="line l6" style="color: #e2e8f0;">  leadership: <span style="color: #fde68a;">"Head of Batch 2023 (Ketua Angkatan) • Staff HRD HMIF"</span>,</div>
            <div class="line l7" style="color: #e2e8f0;">  licenses: [<span style="color: #38bdf8;">"MikroTik MTCNA #2505NA5241"</span>, <span style="color: #38bdf8;">"Red Hat Linux Admin"</span>],</div>
            <div class="line l8" style="color: #e2e8f0;">  industry: [<span style="color: #f472b6;">"Kementerian Luar Negeri RI"</span>, <span style="color: #f472b6;">"CV. Lexa Technology"</span>],</div>
            <div class="line l9" style="color: #e2e8f0;">  stack: [<span style="color: #7dd3fc;">"React"</span>, <span style="color: #7dd3fc;">"Next.js"</span>, <span style="color: #7dd3fc;">"Python"</span>, <span style="color: #7dd3fc;">"Laravel"</span>, <span style="color: #7dd3fc;">"Three.js"</span>, <span style="color: #7dd3fc;">"C#"</span>],</div>
            <div class="line l10" style="color: #94a3b8;">  philosophy: <span style="color: #fde68a;">"Elegance in Architecture • Precision in Execution"</span>,</div>
            <div class="line l11" style="color: #e2e8f0;">  execute: <span style="color: #f43f5e;">async</span> () =&gt; {</div>
            <div class="line l12" style="color: #c084fc;">    <span style="color: #f43f5e;">return await</span> Impact.ship({ standard: <span style="color: #00f2fe;">"Royal Edition"</span> });</div>
            <div class="line l13" style="color: #e2e8f0;">  }</div>
            <div class="line l13" style="color: #e2e8f0;">};<span class="cursor"></span></div>
          </div>
        </div>

        <div class="footer">
          <div style="display: flex; gap: 14px;"><span style="color: #00f2fe;">&#10140; git:(main)</span><span>Ln 13, Col 2</span></div>
          <div style="display: flex; gap: 14px;"><span style="color: #00f2fe;">&#9679; Standalone Engine</span><span style="color: #38bdf8;">TypeScript</span></div>
        </div>
