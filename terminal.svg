<svg fill="none" viewBox="0 0 850 460" width="100%" height="460" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; padding: 15px 25px 0px 25px; box-sizing: border-box; display: flex; justify-content: center; align-items: center;">
      
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');

        .window {
          width: 100%;
          border-radius: 14px;
          background: linear-gradient(135deg, rgba(7, 13, 26, 0.98) 0%, rgba(10, 17, 36, 1) 60%, rgba(6, 11, 22, 0.98) 100%);
          border: 1px solid rgba(0, 242, 254, 0.28);
          box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(129, 140, 248, 0.12), 0 0 32px rgba(0, 242, 254, 0.15), inset 0 0 25px rgba(0, 242, 254, 0.04);
          font-family: 'JetBrains Mono', monospace;
          overflow: hidden;
          position: relative;
        }

        .scanline {
          position: absolute;
          inset: 0;
          background: linear-gradient(to bottom, transparent, rgba(0, 242, 254, 0.08), transparent);
          opacity: 0;
          animation: scan 4.5s ease-in-out infinite;
          pointer-events: none;
          z-index: 10;
        }

        @keyframes scan {
          0% { transform: translateY(-100%); opacity: 0; }
          25% { opacity: 0.6; }
          75% { opacity: 0.25; }
          100% { transform: translateY(100%); opacity: 0; }
        }

        .header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 12px 18px;
          border-bottom: 1px solid rgba(0, 242, 254, 0.15);
          background: rgba(4, 8, 18, 0.75);
        }

        .dots { display: flex; gap: 7px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.4); }
        .dot.red { background: #ff5f57; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #28c840; }

        .title { font-size: 11px; color: rgba(125, 211, 252, 0.75); letter-spacing: 0.2em; font-weight: 600; }

        .status { display: flex; align-items: center; gap: 7px; font-size: 10px; color: #38bdf8; font-weight: 600; letter-spacing: 0.08em; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #00f2fe; box-shadow: 0 0 10px #00f2fe; animation: pulse 2s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .body { padding: 20px 22px; display: flex; font-size: 12.5px; line-height: 1.8; position: relative; }
        .gutter { display: flex; flex-direction: column; align-items: flex-end; padding-right: 18px; color: #334155; user-select: none; font-weight: 500; }
        .code { display: flex; flex-direction: column; width: 100%; overflow: hidden; }
        
        .line { opacity: 0; transform: translateX(-8px); animation: reveal 0.35s ease forwards; white-space: pre; }
        @keyframes reveal { to { opacity: 1; transform: translateX(0); } }

        .l1 { animation-delay: 0.2s; }
        .l2 { animation-delay: 0.5s; }
        .l3 { animation-delay: 0.8s; }
        .l4 { animation-delay: 1.1s; }
        .l5 { animation-delay: 1.4s; }
        .l6 { animation-delay: 1.7s; }
        .l7 { animation-delay: 2.0s; }
        .l8 { animation-delay: 2.3s; }
        .l9 { animation-delay: 2.6s; }
        .l10 { animation-delay: 2.9s; }
        .l11 { animation-delay: 3.2s; }
        .l12 { animation-delay: 3.5s; }
        .l13 { animation-delay: 3.8s; }

        .cursor { display: inline-block; width: 8px; height: 15px; background-color: #00f2fe; vertical-align: middle; margin-left: 5px; opacity: 0; animation: blink 1s step-end infinite; animation-delay: 4.2s; box-shadow: 0 0 8px #00f2fe; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .footer { display: flex; align-items: center; justify-content: space-between; padding: 8px 18px; border-top: 1px solid rgba(0, 242, 254, 0.12); background: rgba(0, 242, 254, 0.03); color: #64748b; font-size: 11px; }
      </style>

